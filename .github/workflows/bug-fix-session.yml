# Bug Hunter — on-demand fix session
#
# Dispatched by ally-be when a SUPER_DUPER_ADMIN presses "Start fix session" on
# a bug in the admin console's Bug Hunter tab. Fixes exactly one already-known
# bug: regression test first, minimal fix, full suite green, PR, and — unless
# the change touches a guarded path (migrations, auth, payments) — merge to
# master.
#
# This file is deliberately thin and identical in every repo that has it. The
# whole protocol lives in ally-be (`src/bug-hunter/constants/bug-fix-prompt.ts`)
# and is fetched at run time, so it cannot drift between the five copies of
# this workflow and a change to it takes effect on the next dispatch rather
# than after five PRs.
#
# It does NOT deploy. Promoting the merged fix to production is a separate,
# explicitly human click in the same admin tab, which dispatches
# production-release.yaml.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY  — for Claude Code
#   GEMINI_API_KEY     — only consumed when the configured engine is "gemini"
#                        (GET pipeline/models). A plain Google AI Studio key.
#                         Also handed to opencode as GOOGLE_GENERATIVE_AI_API_KEY —
#                         its google provider reads that name, not GEMINI_API_KEY.
#   OPENAI_API_KEY      — optional; only consumed when the engine is "opencode" and
#                         the configured model is an OpenAI one.
#   ALLY_BE_API_KEY    — ally-be's platform API_KEY, for the pipeline endpoints
#                        (same key ally-ai / ally-ai-learn already use inbound)
#   BUG_HUNTER_GH_TOKEN — a token that may push branches, open PRs and merge
#                        here. NOT the default GITHUB_TOKEN: a PR opened with
#                        that token does not trigger other workflows, so CI
#                        would never run on the fix.
# Required repository variable:
#   ALLY_BE_API_URL    — base URL of ally-be, e.g. https://api.example.com

name: Bug Hunter — Fix Session

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      finding_id:
        required: true
        type: string
        description: "bug_findings.id this session is for"
      run_id:
        required: true
        type: string
        description: "bug_hunt_runs.id to report progress against"
      repo:
        required: true
        type: string
        description: "Repo slug, e.g. ally-be (used to pick test/lint commands)"
      api_base_url:
        required: true
        type: string
        description: "Base URL of ally-be, for the pipeline callbacks"
      mode:
        required: false
        type: string
        default: "fix"
        description: >-
          "fix" (default) runs the fix protocol. "verify" runs Bug Hunter's
          Verifier instead (OPP-0779): a read-only pass over this finding's
          open PR on the other vendor's model, ending in a verdict rather than
          a merge. Same runner, different protocol — ally-be picks the engine.

concurrency:
  # One session per bug. A double-click in the admin tab, or a retry while the
  # first attempt is still running, must not put two agents in the same repo
  # racing to fix and merge the same thing.
  group: bug-fix-session-${{ inputs.finding_id }}
  cancel-in-progress: false

jobs:
  fix:
    name: Fix one bug
    runs-on: ubuntu-22.04
    # Generous but bounded: the protocol includes a 20-minute wait for an admin
    # to answer an escalated product question, on top of a full test suite run.
    timeout-minutes: 60

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.BUG_HUNTER_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "ally-bug-hunter[bot]"
          git config user.email "bug-hunter@helloally.ai"

      - name: Fetch the fix protocol for this bug
        id: prompt
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -euo pipefail
          # ally-be builds the prompt: it embeds this bug, this repo's test and
          # lint commands, any answer an admin already gave on a previous
          # attempt, and whether merging is permitted for this finding.
          # Three protocols share this runner (OPP-0779/0780): the fix, the
          # Verifier for one fix PR, and the independent verifier for a whole
          # sweep's findings — whose subject is a run, so finding_id carries
          # the verify run id and the prompt is fetched by run.
          case "${{ inputs.mode }}" in
            verify)          PROMPT_URL="${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/findings/${{ inputs.finding_id }}/verify-prompt?runId=${{ inputs.run_id }}&repo=${{ inputs.repo }}" ;;
            verify_findings) PROMPT_URL="${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/runs/${{ inputs.run_id }}/verify-findings-prompt?repo=${{ inputs.repo }}" ;;
            *)               PROMPT_URL="${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/findings/${{ inputs.finding_id }}/fix-prompt?runId=${{ inputs.run_id }}&repo=${{ inputs.repo }}" ;;
          esac
          curl -sSf \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "$PROMPT_URL" \
            -o /tmp/fix-prompt.txt
          test -s /tmp/fix-prompt.txt
          echo "Fetched $(wc -c < /tmp/fix-prompt.txt) bytes of protocol."

      - name: Resolve configured models
        id: models
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -euo pipefail
          # Bug Hunter's model tiers are admin-editable (GlobalSettings, via
          # GET pipeline/models) rather than hardcoded here, for the same
          # reason the fix protocol itself is fetched at runtime instead of
          # copied into this file: a change takes effect on the next session,
          # not after five PRs.
          RESP=$(curl -sSf -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/models?repo=${{ inputs.repo }}&role=${{ inputs.mode == 'verify' && 'verify_fix' || inputs.mode == 'verify_findings' && 'verify_findings' || 'fix' }}&findingId=${{ inputs.finding_id }}")
          ENGINE=$(printf '%s' "$RESP" | jq -r '.engine')
          DEFAULT_MODEL=$(printf '%s' "$RESP" | jq -r '.defaultModel')
          ESCALATION_MODEL=$(printf '%s' "$RESP" | jq -r '.escalationModel')
          if [ -z "$DEFAULT_MODEL" ] || [ "$DEFAULT_MODEL" = "null" ] || [ -z "$ESCALATION_MODEL" ] || [ "$ESCALATION_MODEL" = "null" ]; then
            echo "::error::Could not resolve Bug Hunter's configured models from ally-be."
            exit 1
          fi
          [ -n "$ENGINE" ] && [ "$ENGINE" != "null" ] || ENGINE="gemini"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "default_model=$DEFAULT_MODEL" >> "$GITHUB_OUTPUT"
          # Also the model a gemini-engine run falls back to if it gets stuck
          # — see "Run the fix session"'s own fallback logic.
          echo "escalation_model=$ESCALATION_MODEL" >> "$GITHUB_OUTPUT"
          # Rewritten unconditionally, even on a pure gemini run that never
          # falls back: Gemini CLI has no equivalent to the Task-tool subagent
          # dispatch this file's frontmatter drives, so gemini never reads it
          # either way — cheap to keep current regardless, and it means a
          # gemini-engine run that DOES fall back to Claude below always finds
          # it already pointing at the right model, with no extra step.
          if [ "$ENGINE" = "gemini" ]; then
            echo "Engine is gemini — bug-escalation.md is only read if this run falls back to Claude below."
          fi
          # The committed frontmatter becomes just a fallback the moment this
          # runs — this endpoint is now the one source of truth for the
          # escalation model too, so it can no longer drift across this
          # file's five otherwise-identical copies the way it used to be able
          # to (nothing kept them in sync before).
          sed -i.bak "s/^model: .*/model: $ESCALATION_MODEL/" .claude/agents/bug-escalation.md
          rm -f .claude/agents/bug-escalation.md.bak
          # opencode: a multi-provider harness with the one thing Gemini CLI lacks —
          # Task-tool subagents — so Verify and escalation come back on any
          # vendor's model (spike, 2026-09-30). It names models as
          # provider/model, so a bare id from settings gets its provider from
          # the id's shape, the same rule scripts/builder/run-engine.sh uses.
          # Its agents are the same two files as .claude/agents, converted to
          # its frontmatter (mode, provider/model, permission) and written to
          # the GLOBAL agents dir rather than ./.opencode so the agent can
          # never commit them.
          if [ "$ENGINE" = "opencode" ]; then
            oc_model() {
              case "$1" in
                */*) printf '%s' "$1" ;;
                claude-*) printf 'anthropic/%s' "$1" ;;
                gemini-*) printf 'google/%s' "$1" ;;
                gpt-* | o[0-9]-* | o[0-9]) printf 'openai/%s' "$1" ;;
                *) printf '%s' "$1" ;;
              esac
            }
            mkdir -p ~/.config/opencode/agents
            for agent in bug-verifier bug-escalation; do
              src=".claude/agents/${agent}.md"
              desc=$(awk '/^description:/ { sub(/^description: */, ""); print; exit }' "$src")
              body=$(awk 'BEGIN { n = 0 } /^---$/ && n < 2 { n++; next } n >= 2 { print }' "$src")
              if [ "$agent" = "bug-verifier" ]; then
                model=$(oc_model "$DEFAULT_MODEL")
                perm=$'  edit: deny\n  write: deny\n  bash: allow'
              else
                model=$(oc_model "$ESCALATION_MODEL")
                perm=$'  edit: allow\n  write: allow\n  bash: allow'
              fi
              {
                printf -- '---\ndescription: %s\nmode: subagent\nmodel: %s\npermission:\n%s\n---\n' "$desc" "$model" "$perm"
                printf '%s\n' "$body"
              } > ~/.config/opencode/agents/${agent}.md
            done
            echo "oc_model=$(oc_model "$DEFAULT_MODEL")" >> "$GITHUB_OUTPUT"
            echo "Engine is opencode — agents written to ~/.config/opencode/agents, default model $(oc_model "$DEFAULT_MODEL")."
          fi
          # Best-effort: powers the findings list's model/provider label.
          # ally-be never learns this any other way, since the model is
          # resolved here, not at dispatch time — but losing this call must
          # never fail a session over a cosmetic label.
          curl -sS -X POST "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/model" \
            -H "Content-Type: application/json" -H "x-api-key: $ALLY_BE_API_KEY" \
            -d "{\"engine\":\"$ENGINE\",\"model\":\"$DEFAULT_MODEL\"}" || true

      - name: Install the coding engine
        run: |
          set -euo pipefail
          if [ "${{ steps.models.outputs.engine }}" = "gemini" ]; then
            npm install -g @google/gemini-cli@0.22.5
            gemini --version
            # Installed alongside, not instead: if this run gets stuck (loop
            # detection, an abandoned turn), "Run the fix session" falls back
            # to Claude Code without a second install step mid-fallback.
            npm install -g @anthropic-ai/claude-code@2.1.220
            claude --version
          elif [ "${{ steps.models.outputs.engine }}" = "opencode" ]; then
            # Pinned to the version Builder already runs in CI (scripts/builder/install-engine.sh).
            npm install -g opencode-ai@1.18.32
            opencode --version
          else
            npm install -g @anthropic-ai/claude-code@2.1.220
            claude --version
          fi

      - name: Persist credentials to disk for the agent's own shell
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
          GH_TOKEN: ${{ secrets.BUG_HUNTER_GH_TOKEN }}
        run: |
          set -euo pipefail
          # Gemini CLI's run_shell_command tool strips almost every
          # environment variable from any command it runs whenever it detects
          # GITHUB_SHA is set — always true here — a deliberate, unconditional
          # anti-leak guard with no override (confirmed in gemini-cli-core's
          # shellExecutionService.js). Every step of the fix protocol has the
          # agent itself curl ally-be (report progress, mark the finding as
          # fixing, close the run) and run `gh pr create`/`gh pr merge` — both
          # of which need a credential this sanitization would otherwise wipe
          # right before the command runs, so the agent could reach neither
          # ally-be nor GitHub. Gemini only sanitizes the environment it hands
          # to spawned processes, not the filesystem, so writing the two
          # credentials to disk here — before either CLI starts — survives it:
          # the fix prompt reads the api key back with `$(cat ...)` instead of
          # $ALLY_BE_API_KEY, and `gh auth login` persists to
          # ~/.config/gh/hosts.yml, which `gh` falls back to whenever GH_TOKEN
          # isn't present in its own process's environment. Both are no-ops
          # for Claude Code, which never hit this problem — its Bash tool
          # keeps the environment gemini's tool always had.
          printf '%s' "$ALLY_BE_API_KEY" > /tmp/ally-be-api-key
          chmod 600 /tmp/ally-be-api-key
          # `gh auth login --with-token` refuses outright ("the value of the
          # GH_TOKEN environment variable is being used for authentication")
          # if GH_TOKEN is already set in its own process environment — which
          # it is here, since this step needs it too. Capture it under a
          # different name first, unset the real one just for this command, so
          # `gh` actually persists to ~/.config/gh/hosts.yml instead of
          # refusing.
          TOKEN="$GH_TOKEN"
          unset GH_TOKEN
          echo "$TOKEN" | gh auth login --with-token

      - name: Run the fix session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only consumed when engine=gemini. A plain Google AI Studio key —
          # see run-engine.sh's own note on why this isn't Vertex/Workspace auth.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # opencode's google provider reads THIS name, not GEMINI_API_KEY —
          # Builder's spike found the binary contains both strings and only one
          # is read. Same secret, second name.
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Needed here even though the agent's own curl/gh calls read the key
          # back from disk instead: this step's own script (not the agent)
          # checks the finding's status below to decide whether to fall back,
          # and that check runs in this workflow's normal, unsandboxed shell.
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -uo pipefail

          # ── Engine supervisor ──────────────────────────────────────────
          # Runs the engine in the background and stops it when EITHER the
          # backend says this run is no longer running (the agent has already
          # reported completion) OR a wall-clock cap passes. Needed because
          # some engines hand the model another turn for as long as it keeps
          # running commands: on 2026-10-06 OpenCode + gemini-2.5-pro finished
          # a sweep in 7 minutes, closed the run, then spent 113 more minutes
          # saying "Done" and running `exit 0`, resending the whole session to
          # the model each turn, until the job's timeout-minutes killed it.
          # That timeout is the safety net; this is the budget.
          # A verifier reads and runs the suite once; it has no business
          # taking as long as a fix. 20 minutes, against 40 for a fix.
          case "${{ inputs.mode }}" in
            verify)          ENGINE_CAP_SECONDS=1200 ;;
            verify_findings) ENGINE_CAP_SECONDS=1800 ;;
            *)               ENGINE_CAP_SECONDS=2400 ;;
          esac
          RUN_STATUS_URL="${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/status"
          RUN_REPORT_URL="${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/report"
          supervise() {
            : > /tmp/engine-stop-reason.txt
            # `set -m` gives the background job its own process group, so the
            # kill below reaches the engine's node/binary children too, not
            # just the subshell that launched the pipeline.
            set -m
            "$@" &
            local pid=$!
            set +m
            local started; started=$(date +%s)
            while kill -0 "$pid" 2>/dev/null; do
              sleep 30
              kill -0 "$pid" 2>/dev/null || break
              local now; now=$(date +%s)
              if [ $((now - started)) -ge "$ENGINE_CAP_SECONDS" ]; then
                echo "::warning::The engine has run for $((ENGINE_CAP_SECONDS / 60)) minutes — stopping it. This is the per-run budget, not a crash."
                echo timeout > /tmp/engine-stop-reason.txt
                curl -sS -m 20 -X POST -H "Content-Type: application/json" -H "x-api-key: $ALLY_BE_API_KEY" "$RUN_REPORT_URL" \
                  -d "$(jq -n --arg repo "${{ inputs.repo }}" --argjson cap "$ENGINE_CAP_SECONDS" --arg m "The engine was stopped after $((ENGINE_CAP_SECONDS / 60)) minutes without closing the run — the per-run budget. Whatever it had reported stands; nothing after this point ran." \
                    '{repo: $repo, stage: "error", summary: $m, payload: {engineStopped: "timeout", capSeconds: $cap}}')" || true
                kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
                sleep 15
                kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true
                break
              fi
              local status
              status=$(curl -sS -m 20 -H "x-api-key: $ALLY_BE_API_KEY" "$RUN_STATUS_URL" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
              if [ "$status" != "running" ] && [ "$status" != "unknown" ]; then
                echo "::notice::The run is '$status' — the agent reported completion; stopping the engine rather than letting it keep buying model turns."
                echo closed > /tmp/engine-stop-reason.txt
                kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
                sleep 15
                kill -KILL -- "-$pid" 2>/dev/null || kill -KILL "$pid" 2>/dev/null || true
                break
              fi
            done
            local rc=0
            wait "$pid" 2>/dev/null || rc=$?
            # A stop we chose is not an engine failure. (The kills above end in
            # `|| true` on purpose: this step runs under bash -e, and on
            # 2026-10-07 a kill that found the engine already gone aborted
            # four sweeps the agent had just closed as completed.)
            if [ -s /tmp/engine-stop-reason.txt ]; then return 0; fi
            return $rc
          }

          if [ "${{ steps.models.outputs.engine }}" = "gemini" ]; then
            # No --max-turns / Task-tool equivalent — see the engine-resolution
            # step above for why escalation is simply skipped on this engine.
            # `.response` (not `.result`) is Gemini's non-streaming json field.
            run_gemini() {
              gemini "$(cat /tmp/fix-prompt.txt)" \
                --model "${{ steps.models.outputs.default_model }}" \
                --approval-mode auto_edit \
                --allowed-tools "run_shell_command,read_file,write_file,replace,list_directory,glob,search_file_content" \
                --output-format json | tee /tmp/claude-result.json | jq -r '.response // empty'
            }
            echo "gemini" > /tmp/actual-engine.txt
            supervise run_gemini
            echo "gemini" > /tmp/actual-engine.txt

            # Gemini's own loop-detector (confirmed in gemini-cli-core's
            # loopDetectionService.js) kills a session that's thrashing —
            # correctly, but before the agent gets a turn to report any
            # outcome, leaving the finding stuck at 'fixing'/'queued'. Rather
            # than making an admin notice and retry by hand every time, check
            # for exactly that stuck state here and retry once with Claude
            # Code, which has no equivalent external killer. Same status
            # check "Fail if the session ended without reporting an outcome"
            # uses below, run early enough to still do something about it.
            STATUS=$(curl -sS -H "x-api-key: $ALLY_BE_API_KEY" \
              "${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/findings/${{ inputs.finding_id }}" \
              | jq -r '.status // "unknown"')
            if { [ "$STATUS" = "fixing" ] || [ "$STATUS" = "queued" ]; } && [ "$(cat /tmp/engine-stop-reason.txt 2>/dev/null)" != "timeout" ]; then
              echo "Gemini left the finding '$STATUS' without reporting an outcome — retrying once with Gemini on a clean checkout."

              # Make the fallback visible on the admin timeline, not just this
              # job's log — without this, a Claude retry that goes on to
              # succeed leaves no trace that Gemini ran first and got stuck.
              # There is no structured reason to report: confirmed in
              # gemini-cli-core's nonInteractiveCli.js that `--output-format
              # json` (non-streaming, what this workflow uses) only reacts to
              # a detected loop when a StreamJsonFormatter is active
              # (`--output-format stream-json`); in plain `json` mode the
              # GeminiEventType.LoopDetected event is silently dropped and the
              # CLI exits 0 with whatever partial text it had already
              # generated, exactly as if the turn had ended normally. So the
              # operational signal checked above (finding still 'fixing' /
              # 'queued' with no error) is the only evidence available —
              # attaching Gemini's last partial response text gives a reader
              # something to look at without overclaiming it names a cause.
              EXCERPT=$(jq -r '.response // empty' /tmp/claude-result.json 2>/dev/null | tail -c 400)
              REPORT_BODY=$(jq -n \
                --arg repo "${{ inputs.repo }}" \
                --arg findingId "${{ inputs.finding_id }}" \
                --arg summary "Gemini's session left the bug '$STATUS' without reporting an outcome — most likely its own loop-detector silently stopping a thrashing turn (gemini-cli-core gives no structured signal for this in --output-format json, so it can't be confirmed beyond the finding being left '$STATUS'). Retrying automatically with Gemini." \
                --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --arg excerpt "$EXCERPT" \
                '{repo: $repo, stage: "fix_attempt", summary: $summary, findingId: $findingId, payload: {runUrl: $runUrl, fallback: "gemini-retry", geminiLastResponseExcerpt: $excerpt}}')
              curl -sS -X POST \
                -H "Content-Type: application/json" \
                -H "x-api-key: $ALLY_BE_API_KEY" \
                "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/report" \
                -d "$REPORT_BODY" || true

              # Whatever Gemini left behind (uncommitted edits, a checked-out
              # branch) is discarded — the fix protocol's own contract is
              # already "anything not pushed is gone with the runner", so a
              # clean restart is the same guarantee the agent already works
              # under, not a new one.
              git fetch origin master
              git checkout master --force
              git reset --hard origin/master
              git clean -fd
              # No Claude path: Claude spend is a hard no, so the one retry is Gemini
              # again on a clean checkout rather than Claude Code.
              supervise run_gemini
              echo "gemini" > /tmp/actual-engine.txt
            fi
          elif [ "${{ steps.models.outputs.engine }}" = "opencode" ]; then
            # Config in the GLOBAL dir, never ./opencode.json: anything written
            # into the checkout is something the agent could commit.
            mkdir -p ~/.config/opencode ~/.cache/opencode
            cat > ~/.config/opencode/opencode.json <<'OCEOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "share": "disabled",
            "autoupdate": false,
            "permission": {
              "edit": "allow",
              "bash": { "*": "allow", "rm -rf /*": "deny", "git push --force*": "deny" },
              "task": "allow",
              "webfetch": "deny"
            }
          }
          OCEOF
            # opencode fetches its model catalogue from models.dev at start-up
            # with a very long timeout; a stalled fetch looked exactly like a
            # hung run in the 2026-09-30 spike. Seed the cache with a bounded
            # curl first — if this fails, opencode falls back to fetching it.
            curl -sSf -m 60 https://models.dev/api.json -o ~/.cache/opencode/models.json || true
            # `--format default`, not json: json mode sat silent in the spike
            # while default mode answered in seconds. Tokens and cost come from
            # `opencode export` afterwards (see "Report actual token cost"),
            # which is why stderr — where `--print-logs` names every session id,
            # sub-agents included — is kept.
            run_opencode() {
              opencode run --format default --auto --print-logs \
                --model "${{ steps.models.outputs.oc_model }}" \
                "$(cat /tmp/fix-prompt.txt)" 2> >(tee -a /tmp/opencode.log >&2) | tee -a /tmp/opencode-out.txt
            }
            : > /tmp/opencode.log; : > /tmp/opencode-out.txt
            echo "opencode" > /tmp/actual-engine.txt
            supervise run_opencode

            # Same stuck-check the gemini path runs: an agent that ended its
            # turn mid-protocol leaves the finding where it was. One retry on a
            # clean checkout, recorded on the timeline so a clean second run
            # never hides that the first one stalled.
            STATUS=$(curl -sS -H "x-api-key: $ALLY_BE_API_KEY" \
                "${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/findings/${{ inputs.finding_id }}" \
                | jq -r '.status // "unknown"')
            if { [ "$STATUS" = "fixing" ] || [ "$STATUS" = "queued" ]; } && [ "$(cat /tmp/engine-stop-reason.txt 2>/dev/null)" != "timeout" ]; then
              echo "opencode left the finding '$STATUS' without reporting an outcome — retrying once on a clean checkout."
              EXCERPT=$(tail -c 400 /tmp/opencode-out.txt 2>/dev/null || true)
              REPORT_BODY=$(jq -n \
                --arg repo "${{ inputs.repo }}" --arg findingId "${{ inputs.finding_id }}" \
                --arg summary "opencode's session left the finding '$STATUS' without reporting an outcome. Retrying automatically once on a clean checkout." \
                --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --arg excerpt "$EXCERPT" \
                '{repo: $repo, stage: "fix_attempt", summary: $summary, findingId: $findingId, payload: {runUrl: $runUrl, fallback: "opencode-retry", lastOutputExcerpt: $excerpt}}')
              curl -sS -X POST -H "Content-Type: application/json" -H "x-api-key: $ALLY_BE_API_KEY" \
                "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/report" -d "$REPORT_BODY" || true
              git fetch origin master
              git checkout master --force
              git reset --hard origin/master
              git clean -fd
              supervise run_opencode
            fi
          elif [ "${{ steps.models.outputs.engine }}" = "claude-code" ]; then
            # Claude Code is an engine again (decided 2026-10-07, after 0975d3c7
            # had removed it): Gemini and OpenCode carry the bulk of the work, and
            # the Finder or the Verifier picks Claude where its record earns it —
            # above all as the OTHER vendor's reading of a Gemini-made fix.
            run_claude() {
              claude -p "$(cat /tmp/fix-prompt.txt)" \
                --permission-mode acceptEdits \
                --model "${{ steps.models.outputs.default_model }}" \
                --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task" \
                --max-turns 120 \
                --output-format json | tee /tmp/claude-result.json | jq -r '.result // empty'
            }
            echo "claude-code" > /tmp/actual-engine.txt
            supervise run_claude
          else
            echo "::error::Bug Hunter engine is '${{ steps.models.outputs.engine }}' — expected gemini, opencode or claude-code. Set the engine in admin."
            exit 1
          fi

      - name: Report actual token cost
        # Best-effort: the fix protocol's own /close call already closed this
        # run — this just attaches the real per-model token usage the CLI
        # reported, so "Est. cost" in the admin tab stops reading $0 for every
        # run. Must never fail the job over a cost-reporting hiccup, and must
        # still run when the session itself failed — partial spend is still
        # real spend.
        #
        # The two engines' `--output-format json` results share nothing:
        # Claude Code's is `{result, total_cost_usd, modelUsage: {<model>:
        # {inputTokens, outputTokens, ...}}}`; Gemini's is `{session_id,
        # response, stats: {input_tokens, output_tokens, ...}}` — no per-model
        # breakdown (it only ever ran one model) and no cost figure at all
        # (confirmed absent from its schema — ally-be computes its own
        # estimate from the token counts either way, via the same pricing
        # table, so a real $0 here from Gemini is not a lost figure).
        # Parsing this with the Claude-only jq filter silently produced
        # modelUsage:[] for every Gemini run, tier notwithstanding — this
        # step just never matched its shape.
        #
        # A second, separate shape mistake lived here too, found only by
        # comparing a real MERGED Gemini run's reported cost ($0) against its
        # own gemini-cli-core source: `--output-format json`'s `stats` field
        # is `SessionMetrics` (uiTelemetry.js) — `{models: {<model>: {tokens:
        # {input, prompt, candidates, cached, ...}}}}`, keyed BY MODEL, not
        # the flat `{input_tokens, output_tokens, cached}` shape that only
        # `--output-format stream-json`'s terminal event uses. `.stats.input_tokens`
        # was reading a field that never existed here, so every Gemini run —
        # including ones that finished cleanly — silently reported zero
        # tokens. Iterating `.stats.models` also naturally captures a
        # secondary model Gemini's own routing sometimes uses (its own
        # classifier), which a single hardcoded model name would have missed.
        # `tokens.input` (not `.prompt`) is the net-of-cache count — `.prompt`
        # would double-count the cached portion against computeCostUsd's
        # separate, discounted cache-read term.
        if: always()
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -uo pipefail
          # Not steps.models.outputs.engine: that's whichever engine was
          # CONFIGURED, but a gemini run that got stuck and fell back to
          # Claude overwrote /tmp/claude-result.json with Claude's own shape
          # — parsing it as Gemini's would silently zero it out again.
          ACTUAL_ENGINE=$(cat /tmp/actual-engine.txt 2>/dev/null || echo "${{ steps.models.outputs.engine }}")
          if [ -s /tmp/claude-result.json ] || [ "$ACTUAL_ENGINE" = "opencode" ]; then
            if [ "$ACTUAL_ENGINE" = "gemini" ]; then
              MODEL_USAGE=$(jq -c \
                '[(.stats.models // {}) | to_entries[] | {model: .key, inputTokens: (.value.tokens.input // 0), outputTokens: (.value.tokens.candidates // 0), cacheReadInputTokens: (.value.tokens.cached // 0), cacheCreationInputTokens: 0}]' \
                /tmp/claude-result.json 2>/dev/null || echo '[]')
              # No cliReportedCostUsd key at all here — NOT 0. `formatCost` in
              # the admin tab prefers cliReportedCostUsd whenever it is
              # non-null, so sending a literal 0 permanently masked the real
              # computeCostUsd estimate behind it: two real runs computed
              # $0.5063 and $6.6549 server-side and both still showed
              # "$0.0000" in the tab, because Gemini reporting 0 (it never has
              # a cost figure at all) looked identical to Claude Code
              # genuinely reporting a real $0. Omitting the key leaves
              # cliReportedCostUsd null, so the tab correctly falls back to
              # the token-based estimate instead.
              BODY="{\"modelUsage\":${MODEL_USAGE}}"
            elif [ "$ACTUAL_ENGINE" = "opencode" ]; then
              # opencode's session export carries per-message `tokens` and
              # `cost` (spike, 2026-09-30). Sub-agents run as child sessions,
              # each logged as "created id=ses_…" by --print-logs, so export
              # every session the log names and sum by model. Reasoning tokens
              # are billed as output and counted with it.
              MODEL_USAGE='[]'
              CLI_COST=0
              for SID in $(grep -oE 'created id=ses_[A-Za-z0-9]+' /tmp/opencode.log 2>/dev/null | sed 's/created id=//' | sort -u); do
                opencode export "$SID" > "/tmp/oc-${SID}.json" 2>/dev/null || rm -f "/tmp/oc-${SID}.json"
              done
              if ls /tmp/oc-ses_*.json >/dev/null 2>&1; then
                MODEL_USAGE=$(jq -sc '[.[] | .messages[]? | .info | select(.role == "assistant")] | group_by(.modelID) | map({model: .[0].modelID, inputTokens: (map(.tokens.input // 0) | add), outputTokens: (map((.tokens.output // 0) + (.tokens.reasoning // 0)) | add), cacheReadInputTokens: (map(.tokens.cache.read // 0) | add), cacheCreationInputTokens: (map(.tokens.cache.write // 0) | add)})' /tmp/oc-ses_*.json 2>/dev/null || echo '[]')
                CLI_COST=$(jq -s '[.[] | .messages[]? | .info | select(.role == "assistant") | (.cost // 0)] | add // 0' /tmp/oc-ses_*.json 2>/dev/null || echo 0)
              fi
              BODY="{\"modelUsage\":${MODEL_USAGE},\"cliReportedCostUsd\":${CLI_COST}}"
            else
              MODEL_USAGE=$(jq -c '[(.modelUsage // {}) | to_entries[] | {model: (.value.canonicalModel // .key), inputTokens: (.value.inputTokens // 0), outputTokens: (.value.outputTokens // 0), cacheReadInputTokens: (.value.cacheReadInputTokens // 0), cacheCreationInputTokens: (.value.cacheCreationInputTokens // 0)}]' /tmp/claude-result.json 2>/dev/null || echo '[]')
              CLI_COST=$(jq -r '.total_cost_usd // 0' /tmp/claude-result.json 2>/dev/null || echo 0)
              BODY="{\"modelUsage\":${MODEL_USAGE},\"cliReportedCostUsd\":${CLI_COST}}"
            fi
            curl -sS -X POST "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/cost" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $ALLY_BE_API_KEY" \
              -d "$BODY" || true
          fi

      - name: Fail if the session ended without reporting an outcome
        # `claude -p` exits 0 whenever the agent produces a final response —
        # including when it ends its turn mid-protocol, which is a real failure
        # mode: one session backgrounded its pre-commit-hooked `git commit`,
        # said it would push "once it finishes", and ended. The process died
        # with the runner, nothing was pushed, and the job stayed green. The
        # finding then sat FIXING until `reconcileFixingSessions` timed it out
        # half an hour later with a message nobody could act on.
        #
        # So: re-read the finding. If it is still `fixing` (or never left
        # `queued`), the protocol was abandoned. Say exactly that against the
        # run, mark it failed, close the run so it stops looking live, and go
        # red — a stopped session should reach a human as an explicit report,
        # not as an inferred timeout.
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -uo pipefail
          STATUS=$(curl -sS -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/findings/${{ inputs.finding_id }}" \
            | jq -r '.status // "unknown"')
          echo "Finding ${{ inputs.finding_id }} is '$STATUS' after the session."

          # `unknown` means ally-be was unreachable, not that the agent failed.
          # Never fail a session over a reporting hiccup — reconcile still has
          # the run to fall back on.
          if [ "$STATUS" != "fixing" ] && [ "$STATUS" != "queued" ]; then
            exit 0
          fi

          echo "::error::The fix session ended while the finding was still '$STATUS' — it stopped mid-protocol without reporting an outcome."
          # A gemini-engine run that fell back to Claude above (see "Run the
          # fix session") overwrote /tmp/actual-engine.txt with "claude-code"
          # — reaching this step in THAT case means the fallback itself also
          # failed to reach a terminal outcome, which is worth saying plainly
          # rather than folding into the fully generic message below.
          ACTUAL_ENGINE=$(cat /tmp/actual-engine.txt 2>/dev/null || echo "${{ steps.models.outputs.engine }}")
          if [ "${{ steps.models.outputs.engine }}" = "gemini" ] && [ "$ACTUAL_ENGINE" = "claude-code" ]; then
            SUMMARY="Gemini's session ended without reporting an outcome, and the automatic Claude Code fallback (${{ steps.models.outputs.escalation_model }}) then also ended while the bug was still '$STATUS' without opening a PR, escalating, or dismissing. Anything not pushed is gone with the runner. Start a new session to retry."
          else
            SUMMARY="The fix session ended while the bug was still '$STATUS' — the agent stopped mid-protocol without opening a PR, escalating, or dismissing. Anything it had not pushed is gone with the runner. Start a new session to retry."
          fi
          # Before the close, or appendEvent rejects it: a closed run refuses
          # further events.
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/report" \
            -d "{\"repo\":\"${{ inputs.repo }}\",\"stage\":\"error\",\"summary\":\"${SUMMARY}\",\"findingId\":\"${{ inputs.finding_id }}\",\"payload\":{\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"findingStatus\":\"${STATUS}\"}}" || true
          curl -sS -X PATCH \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/findings/${{ inputs.finding_id }}" \
            -d '{"status":"failed"}' || true
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/close" \
            -d "{\"status\":\"failed\",\"foundCount\":1,\"dismissedCount\":1,\"errorMessage\":\"${SUMMARY}\"}" || true

          # The generic failure reporter below would otherwise post a second,
          # vaguer error event on top of this one.
          touch /tmp/bug-fix-already-reported
          exit 1

      - name: Report a runner-level failure
        # The protocol has ally-be told about every outcome it can reach by
        # itself. This covers the ones it cannot: the runner dying, npm ci
        # failing, the API key being wrong. Without it the finding would sit at
        # QUEUED until the reconcile task timed it out 30 minutes later with no
        # explanation of what went wrong.
        if: failure()
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -uo pipefail
          # The gate step above already posted a precise account of what went
          # wrong and closed the run. Adding this generic one on top would just
          # bury it in the drawer.
          if [ -f /tmp/bug-fix-already-reported ]; then
            echo "Already reported by the outcome gate; nothing to add."
            exit 0
          fi
          # The agent closes its own run; if it already did, this step has
          # nothing to add — re-closing it as failed with zero totals is how
          # four completed sweeps read as failures on 2026-10-07.
          STATUS=$(curl -sS -m 20 -H "x-api-key: $ALLY_BE_API_KEY" "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/status" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          if [ "$STATUS" != "running" ] && [ "$STATUS" != "unknown" ]; then
            echo "The run is already '$STATUS'; the agent closed it. Not re-closing it as failed."
            exit 0
          fi
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/report" \
            -d "{\"repo\":\"${{ inputs.repo }}\",\"stage\":\"error\",\"summary\":\"The fix session runner failed before finishing. See the GitHub Actions run for details.\",\"findingId\":\"${{ inputs.finding_id }}\",\"payload\":{\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}" || true
          curl -sS -X PATCH \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/pipeline/findings/${{ inputs.finding_id }}" \
            -d '{"status":"failed"}' || true
          # Without this a run whose runner died stays RUNNING forever: nothing
          # in ally-be ever closes a run it did not hear from.
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ inputs.api_base_url }}/api/v1/bug-hunter/runs/${{ inputs.run_id }}/close" \
            -d '{"status":"failed","foundCount":1,"dismissedCount":1,"errorMessage":"The fix session runner failed before finishing."}' || true
