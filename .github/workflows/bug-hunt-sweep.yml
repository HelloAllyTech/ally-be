# Bug Hunter — repo-wide sweep
#
# The unattended sweep. Runs the four finders (test/lint, code review,
# production logs, human-reported bugs), verifies what is unproven, and — in AI
# mode — fixes what survives, auto-merging at most a handful of genuinely
# trivial fixes and leaving the rest as PRs.
#
# ## Why this workflow exists
#
# The sweep has always been `.claude/workflows/bug-hunt.mjs`, a Claude Code
# *Workflow* script. Those use `agent()` / `parallel()` / `budget` primitives
# that only exist inside a Claude Code session, so a GitHub runner cannot
# execute one. The consequence was that nothing ever triggered a sweep:
# `BugHuntTrigger.SCHEDULED` was a valid enum value with no producer anywhere,
# and the only route that started a run was api-key-only. A bug hunter that
# depends on someone remembering to run it by hand is not a bug hunter.
#
# Like `bug-fix-session.yml`, this file is deliberately thin and identical in
# every repo. The protocol lives in ally-be
# (`src/bug-hunter/constants/bug-hunt-sweep-prompt.ts`) and is fetched at run
# time, so it cannot drift between copies and a change takes effect on the next
# run rather than after five PRs.
#
# It does NOT deploy, and it never tags a release. Promoting anything to
# production stays an explicitly human click in the admin tab.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY   — for Claude Code
#   GEMINI_API_KEY      — only consumed when the configured engine is "gemini"
#                         (GET pipeline/models). A plain Google AI Studio key.
#   ALLY_BE_API_KEY     — ally-be's platform API_KEY, for the pipeline endpoints
#   BUG_HUNTER_GH_TOKEN — may push branches, open PRs and merge here. NOT the
#                         default GITHUB_TOKEN: a PR opened with that token does
#                         not trigger other workflows, so CI would never run on
#                         the fix.
# Required repository variable:
#   ALLY_BE_API_URL     — base URL of ally-be, e.g. https://api.example.com

name: Bug Hunter — Sweep

permissions:
  contents: write
  pull-requests: write

on:
  # Nightly, staggered per repo so five sweeps do not hit ally-be's pipeline
  # endpoints and the Anthropic API in the same minute. ally-be: 02:15 UTC.
  schedule:
    - cron: "15 2 * * *"

  workflow_dispatch:
    inputs:
      run_id:
        required: false
        type: string
        description: >
          bug_hunt_runs.id to report against. Supplied when ally-be dispatched
          this (the admin pressed "Start a sweep"), so the tab shows a run
          immediately. Left empty by the cron, which opens its own run below.
      repo:
        required: false
        type: string
        description: "Repo slug, e.g. ally-be. Defaults to this repository's name."
      deep:
        required: false
        type: string
        default: "false"
        description: >
          "true" reads the whole repo instead of the last day of commits. Much
          more expensive — the nightly cron leaves this false and a human opts
          in per sweep.
      api_base_url:
        required: false
        type: string
        description: "Base URL of ally-be. Defaults to the ALLY_BE_API_URL variable."

concurrency:
  # One sweep per repo. A cron firing while a human-triggered sweep is still
  # running would put two agents in the same checkout opening PRs for the same
  # findings.
  group: bug-hunt-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep for bugs
    runs-on: ubuntu-22.04
    # A full suite plus four finders plus fixes. Bounded well above the fix
    # session's 60, because a sweep may fix several findings in one run.
    timeout-minutes: 120

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.BUG_HUNTER_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "ally-bug-hunter[bot]"
          git config user.email "bug-hunter@helloally.ai"

      - name: Resolve inputs
        id: cfg
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
          FALLBACK_API_URL: ${{ vars.ALLY_BE_API_URL }}
        run: |
          set -euo pipefail
          REPO="${{ inputs.repo }}"
          [ -n "$REPO" ] || REPO="${GITHUB_REPOSITORY##*/}"
          API="${{ inputs.api_base_url }}"
          [ -n "$API" ] || API="$FALLBACK_API_URL"
          test -n "$API" || { echo "::error::No ally-be base URL — set the ALLY_BE_API_URL variable."; exit 1; }

          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            # The scheduled path. ally-be opens the run for a human-triggered
            # sweep so the tab can show it straight away; a cron has to open its
            # own. `trigger` is what tells the two apart in the run history.
            RESPONSE=$(curl -sS -X POST "$API/api/v1/bug-hunter/runs" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $ALLY_BE_API_KEY" \
              -d "{\"trigger\":\"scheduled\",\"repo\":\"$REPO\"}")
            RUN_ID=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("runId") or "")')
            MODE=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("mode") or "")')
            SKIPPED_REASON=$(printf '%s' "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("skippedReason") or "")')
            if [ -z "$RUN_ID" ]; then
              # Either Bug Hunter is OFF, or (only on this scheduled path) the
              # repo has had no commits since its last sweep and no
              # production log group to catch an issue without one — either
              # way ally-be has already recorded the skipped run itself; there
              # is nothing to do here and this is not a failure.
              if [ "$SKIPPED_REASON" = "quiet" ]; then
                echo "Nothing new in $REPO since the last sweep. Skipped with zero token spend."
              else
                echo "Bug Hunter is off duty (mode=${MODE:-off}). Nothing to sweep."
              fi
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Sweeping $REPO as run $RUN_ID."

      - name: Fetch the sweep protocol
        if: steps.cfg.outputs.skip != 'true'
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -euo pipefail
          # ally-be builds the prompt: it embeds this repo's test and lint
          # commands, the live mode (MANUAL stops at pending_approval, AI carries
          # on into Fix), and the merge cap.
          curl -sSf \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/pipeline/sweep-prompt?repo=${{ steps.cfg.outputs.repo }}&runId=${{ steps.cfg.outputs.run_id }}&deep=${{ inputs.deep || 'false' }}" \
            -o /tmp/sweep-prompt.txt
          test -s /tmp/sweep-prompt.txt
          echo "Fetched $(wc -c < /tmp/sweep-prompt.txt) bytes of protocol."

      - name: Resolve configured models
        if: steps.cfg.outputs.skip != 'true'
        id: models
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -euo pipefail
          # Bug Hunter's model tiers are admin-editable (GlobalSettings, via
          # GET pipeline/models) rather than hardcoded here, for the same
          # reason the sweep protocol itself is fetched at runtime instead of
          # copied into this file: a change takes effect on the next run, not
          # after five PRs. Fetched here rather than passed as a
          # workflow_dispatch input (Builder's approach for its own model
          # settings) because that would miss the cron-triggered path above,
          # which never goes through workflow_dispatch at all.
          RESP=$(curl -sSf -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/pipeline/models?repo=${{ steps.cfg.outputs.repo }}")
          ENGINE=$(printf '%s' "$RESP" | jq -r '.engine')
          DEFAULT_MODEL=$(printf '%s' "$RESP" | jq -r '.defaultModel')
          ESCALATION_MODEL=$(printf '%s' "$RESP" | jq -r '.escalationModel')
          if [ -z "$DEFAULT_MODEL" ] || [ "$DEFAULT_MODEL" = "null" ] || [ -z "$ESCALATION_MODEL" ] || [ "$ESCALATION_MODEL" = "null" ]; then
            echo "::error::Could not resolve Bug Hunter's configured models from ally-be."
            exit 1
          fi
          [ -n "$ENGINE" ] && [ "$ENGINE" != "null" ] || ENGINE="claude-code"
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"
          echo "default_model=$DEFAULT_MODEL" >> "$GITHUB_OUTPUT"
          if [ "$ENGINE" = "gemini" ]; then
            # Gemini CLI has no equivalent to the Task-tool subagent dispatch
            # `.claude/agents/bug-escalation.md` relies on, so a gemini-engine
            # sweep skips escalation entirely rather than rewriting frontmatter
            # a claude-code-only mechanism will never read.
            echo "Engine is gemini — leaving bug-escalation.md untouched (escalation is claude-code only)."
          else
            # The committed frontmatter becomes just a fallback the moment this
            # runs — this endpoint is now the one source of truth for the
            # escalation model too, so it can no longer drift across this
            # file's five otherwise-identical copies the way it used to be able
            # to (nothing kept them in sync before).
            sed -i.bak "s/^model: .*/model: $ESCALATION_MODEL/" .claude/agents/bug-escalation.md
            rm -f .claude/agents/bug-escalation.md.bak
          fi
          # Best-effort: powers the findings list's model/provider label.
          # ally-be never learns this any other way, since the model is
          # resolved here, not at dispatch time — but losing this call must
          # never fail a sweep over a cosmetic label.
          curl -sS -X POST "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/runs/${{ steps.cfg.outputs.run_id }}/model" \
            -H "Content-Type: application/json" -H "x-api-key: $ALLY_BE_API_KEY" \
            -d "{\"engine\":\"$ENGINE\",\"model\":\"$DEFAULT_MODEL\"}" || true

      - name: Install the coding engine
        if: steps.cfg.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.models.outputs.engine }}" = "gemini" ]; then
            npm install -g @google/gemini-cli@0.22.5
            gemini --version
          else
            npm install -g @anthropic-ai/claude-code@2.1.220
            claude --version
          fi

      - name: Persist credentials to disk for the agent's own shell
        if: steps.cfg.outputs.skip != 'true'
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
          GH_TOKEN: ${{ secrets.BUG_HUNTER_GH_TOKEN }}
        run: |
          set -euo pipefail
          # Gemini CLI's run_shell_command tool strips almost every
          # environment variable from any command it runs whenever it detects
          # GITHUB_SHA is set — always true here — a deliberate, unconditional
          # anti-leak guard with no override (confirmed in gemini-cli-core's
          # shellExecutionService.js). Every step of the sweep protocol has the
          # agent itself curl ally-be (report findings, close the run) and run
          # `gh pr create`/`gh pr merge` — both need a credential this
          # sanitization would otherwise wipe right before the command runs.
          # Gemini only sanitizes the environment it hands to spawned
          # processes, not the filesystem, so writing the two credentials to
          # disk here — before either CLI starts — survives it: the sweep
          # prompt reads the api key back with `$(cat ...)` instead of
          # $ALLY_BE_API_KEY, and `gh auth login` persists to
          # ~/.config/gh/hosts.yml, which `gh` falls back to whenever GH_TOKEN
          # isn't present in its own process's environment. Both are no-ops
          # for Claude Code, which never hit this problem — its Bash tool
          # keeps the environment gemini's tool always had.
          printf '%s' "$ALLY_BE_API_KEY" > /tmp/ally-be-api-key
          chmod 600 /tmp/ally-be-api-key
          # `gh auth login --with-token` refuses outright ("the value of the
          # GH_TOKEN environment variable is being used for authentication")
          # if GH_TOKEN is already set in its own process environment — which
          # it is here, since this step needs it too. Capture it under a
          # different name first, unset the real one just for this command, so
          # `gh` actually persists to ~/.config/gh/hosts.yml instead of
          # refusing.
          TOKEN="$GH_TOKEN"
          unset GH_TOKEN
          echo "$TOKEN" | gh auth login --with-token

      - name: Run the sweep
        if: steps.cfg.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only consumed when engine=gemini. A plain Google AI Studio key —
          # see run-engine.sh's own note on why this isn't Vertex/Workspace auth.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # NOT ALLY_BE_API_KEY / GH_TOKEN here: the prompt's own curl/gh calls
          # now read them back from what the previous step wrote to disk, so
          # neither needs to sit in this step's process environment too.
        run: |
          set -euo pipefail
          if [ "${{ steps.models.outputs.engine }}" = "gemini" ]; then
            # No --max-turns / Task-tool equivalent — see the engine-resolution
            # step above for why escalation is simply skipped on this engine.
            # `.response` (not `.result`) is Gemini's non-streaming json field.
            gemini "$(cat /tmp/sweep-prompt.txt)" \
              --model "${{ steps.models.outputs.default_model }}" \
              --approval-mode auto_edit \
              --allowed-tools "run_shell_command,read_file,write_file,replace,list_directory,glob,search_file_content" \
              --output-format json | tee /tmp/claude-result.json | jq -r '.response // empty'
          else
            claude -p "$(cat /tmp/sweep-prompt.txt)" \
              --permission-mode acceptEdits \
              --model "${{ steps.models.outputs.default_model }}" \
              --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task" \
              --max-turns 300 \
              --output-format json | tee /tmp/claude-result.json | jq -r '.result // empty'
          fi

      - name: Report actual token cost
        # Best-effort: the pipeline's own /close call (inside the prompt
        # fetched above) already closed this run — this just attaches the
        # real per-model token usage the CLI reported, so "Est. cost" in the
        # admin tab stops reading $0 for every run. Must never fail the job
        # over a cost-reporting hiccup, and must still run when the sweep
        # itself failed — partial spend is still real spend.
        #
        # The two engines' `--output-format json` results share nothing:
        # Claude Code's is `{result, total_cost_usd, modelUsage: {<model>:
        # {inputTokens, outputTokens, ...}}}`; Gemini's is `{session_id,
        # response, stats: {input_tokens, output_tokens, ...}}` — no per-model
        # breakdown (it only ever ran one model) and no cost figure at all
        # (confirmed absent from its schema — ally-be computes its own
        # estimate from the token counts either way, via the same pricing
        # table, so a real $0 here from Gemini is not a lost figure).
        # Parsing this with the Claude-only jq filter silently produced
        # modelUsage:[] for every Gemini run, tier notwithstanding — this
        # step just never matched its shape.
        #
        # A second, separate shape mistake lived here too, found only by
        # comparing a real MERGED Gemini run's reported cost ($0) against its
        # own gemini-cli-core source: `--output-format json`'s `stats` field
        # is `SessionMetrics` (uiTelemetry.js) — `{models: {<model>: {tokens:
        # {input, prompt, candidates, cached, ...}}}}`, keyed BY MODEL, not
        # the flat `{input_tokens, output_tokens, cached}` shape that only
        # `--output-format stream-json`'s terminal event uses. `.stats.input_tokens`
        # was reading a field that never existed here, so every Gemini run —
        # including ones that finished cleanly — silently reported zero
        # tokens. Iterating `.stats.models` also naturally captures a
        # secondary model Gemini's own routing sometimes uses (its own
        # classifier), which a single hardcoded model name would have missed.
        # `tokens.input` (not `.prompt`) is the net-of-cache count — `.prompt`
        # would double-count the cached portion against computeCostUsd's
        # separate, discounted cache-read term.
        if: always() && steps.cfg.outputs.skip != 'true'
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -uo pipefail
          if [ -s /tmp/claude-result.json ]; then
            if [ "${{ steps.models.outputs.engine }}" = "gemini" ]; then
              MODEL_USAGE=$(jq -c \
                '[(.stats.models // {}) | to_entries[] | {model: .key, inputTokens: (.value.tokens.input // 0), outputTokens: (.value.tokens.candidates // 0), cacheReadInputTokens: (.value.tokens.cached // 0), cacheCreationInputTokens: 0}]' \
                /tmp/claude-result.json 2>/dev/null || echo '[]')
              CLI_COST=0
            else
              MODEL_USAGE=$(jq -c '[(.modelUsage // {}) | to_entries[] | {model: (.value.canonicalModel // .key), inputTokens: (.value.inputTokens // 0), outputTokens: (.value.outputTokens // 0), cacheReadInputTokens: (.value.cacheReadInputTokens // 0), cacheCreationInputTokens: (.value.cacheCreationInputTokens // 0)}]' /tmp/claude-result.json 2>/dev/null || echo '[]')
              CLI_COST=$(jq -r '.total_cost_usd // 0' /tmp/claude-result.json 2>/dev/null || echo 0)
            fi
            curl -sS -X POST "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/runs/${{ steps.cfg.outputs.run_id }}/cost" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $ALLY_BE_API_KEY" \
              -d "{\"modelUsage\":${MODEL_USAGE},\"cliReportedCostUsd\":${CLI_COST}}" || true
          fi

      - name: Fail if the sweep ended without closing its run
        # Same hole `bug-fix-session.yml` had. `claude -p` exits 0 whenever the
        # agent produces a final response, including when it ends its turn
        # mid-protocol — a fix session once backgrounded its `git commit`, said
        # it would push "once it finishes", and ended; the runner died with the
        # work in its tree and the job stayed green.
        #
        # A sweep has no single finding to read, so the terminal marker is the
        # run itself: the protocol's last instruction is to close it. Still
        # RUNNING once the CLI has exited means the agent stopped early, and
        # nothing else would ever notice — there is no reconcile pass for an
        # open run, so it would look like a sweep still working forever.
        if: steps.cfg.outputs.skip != 'true'
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -uo pipefail
          STATUS=$(curl -sS -H "x-api-key: $ALLY_BE_API_KEY" \
            "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/runs/${{ steps.cfg.outputs.run_id }}/status" \
            | jq -r '.status // "unknown"')
          echo "Run ${{ steps.cfg.outputs.run_id }} is '$STATUS' after the sweep."

          # Anything but `running` is a sweep that closed itself, one way or
          # another. `unknown` means ally-be was unreachable, not that the
          # agent failed — never fail a sweep over a reporting hiccup.
          if [ "$STATUS" != "running" ]; then
            exit 0
          fi

          echo "::error::The sweep ended with its run still open — it stopped mid-protocol without closing it."
          SUMMARY="The sweep ended with its run still open — the agent stopped mid-protocol without closing it, so whatever it had not already reported is lost with the runner. Findings it did persist are kept. Start a new sweep to retry."
          # Before the close, or appendEvent rejects it: a closed run refuses
          # further events.
          curl -sS -X POST \
            "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/runs/${{ steps.cfg.outputs.run_id }}/report" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            -d "{\"repo\":\"${{ steps.cfg.outputs.repo }}\",\"stage\":\"error\",\"summary\":\"${SUMMARY}\",\"payload\":{\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}" || true
          curl -sS -X POST \
            "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/runs/${{ steps.cfg.outputs.run_id }}/close" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            -d "{\"status\":\"failed\",\"foundCount\":0,\"autoMergedCount\":0,\"prOpenedCount\":0,\"dismissedCount\":0,\"errorMessage\":\"${SUMMARY}\"}" || true

          # The generic failure reporter below would otherwise post a second,
          # vaguer error event on top of this one.
          touch /tmp/bug-sweep-already-reported
          exit 1

      - name: Report a runner-level failure
        # The protocol has the agent close its own run for every outcome it can
        # reach. This covers the ones it cannot: the runner dying, npm ci
        # failing, a bad API key. Without it the run sits RUNNING forever and
        # looks to an admin like a sweep still working.
        if: failure() && steps.cfg.outputs.skip != 'true'
        env:
          ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
        run: |
          set -eu
          # The gate step above already posted a precise account of what went
          # wrong and closed the run. Adding this generic one on top would just
          # bury it in the admin tab.
          if [ -f /tmp/bug-sweep-already-reported ]; then
            echo "Already reported by the outcome gate; nothing to add."
            exit 0
          fi
          curl -sS -X POST \
            "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/runs/${{ steps.cfg.outputs.run_id }}/report" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            -d "{\"repo\":\"${{ steps.cfg.outputs.repo }}\",\"stage\":\"error\",\"summary\":\"The sweep runner failed before the agent could close the run — see the GitHub Actions log.\"}" || true
          curl -sS -X POST \
            "${{ steps.cfg.outputs.api }}/api/v1/bug-hunter/runs/${{ steps.cfg.outputs.run_id }}/close" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ALLY_BE_API_KEY" \
            -d '{"status":"failed","foundCount":0,"autoMergedCount":0,"prOpenedCount":0,"dismissedCount":0}' || true
