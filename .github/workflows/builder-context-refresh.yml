name: Builder context refresh

# Regenerate the Repo Knowledge Packs the Builder interviewer reads.
#
# This is the cheap half of "codebase-aware". Reading real files through the
# GitHub API costs a round-trip and thousands of tokens each; a map is the
# index that tells the agent which few files are worth that cost. Generating it
# once a week and reusing it across every interview turn — where prompt caching
# then holds it — is the difference between an agent that knows the platform
# and one that pays to rediscover it every session.
#
# Weekly rather than per-session for the same reason: nothing here changes
# hour to hour, and a per-session refresh would spend more than it saves.

on:
  schedule:
    # Sunday 03:00 UTC — nobody is interviewing, and it lands before Monday.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      repos:
        description: 'JSON array of repos to refresh (default: all)'
        required: false
        default: '["ally-be","ally-web","ally-ai","ally-ai-learn","ally-mobile"]'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALLY_BE_API_URL: ${{ vars.ALLY_BE_API_URL }}
      ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
      # The Gemini key, under the one name opencode's google provider reads.
      # It ignores GEMINI_API_KEY, which is what this job used to set — see
      # install-engine.sh and builder-session.yml.
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUILDER_GH_TOKEN: ${{ secrets.BUILDER_GH_TOKEN }}
      REFRESH_REPOS: ${{ inputs.repos || '["ally-be","ally-web","ally-ai","ally-ai-learn","ally-mobile"]' }}
      # Job-level, not step-level: install-engine.sh and refresh-repo-map.sh
      # both read it, and a map generated by an engine other than the one that
      # was installed is the failure mode this used to have in reverse — the
      # step installed Claude Code while the script asked for it by name, so
      # neither could be changed without the other silently breaking.
      BUILDER_ENGINE: opencode

    steps:
      - uses: actions/checkout@v4
        with:
          path: protocol
          token: ${{ secrets.BUILDER_GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the engine
        run: protocol/scripts/builder/install-engine.sh

      - name: Refresh each repo's map
        run: |
          set -uo pipefail
          attempted=0
          failed=""
          for repo in $(echo "$REFRESH_REPOS" | jq -r '.[]'); do
            attempted=$((attempted + 1))
            echo "::group::map $repo"
            # Per-repo failure is tolerated: one repo whose clone or model call
            # failed should not cost the other four their refresh. A stale map
            # is usable; no map at all sends the agent back to paging files.
            if ! protocol/scripts/builder/refresh-repo-map.sh "$repo"; then
              echo "::warning::Could not refresh the map for ${repo}"
              failed="${failed} ${repo}"
            fi
            echo "::endgroup::"
          done

          # ...but not total failure. Every repo failing is one broken thing —
          # an engine, a key, the endpoint — not five bad draws, and tolerating
          # it is how this job stayed green after 2026-09-25 while refresh-repo-map.sh
          # rejected the engine it was handed for every repo, every week.
          # Zero attempted counts too: a malformed `repos` input leaves the
          # loop with nothing to do, which is the same silence.
          if [ "$attempted" -eq 0 ]; then
            echo "::error::No repos to refresh — the repos input did not parse as a non-empty JSON array: ${REFRESH_REPOS}"
            exit 1
          fi
          refreshed=$((attempted - $(echo "$failed" | wc -w)))
          if [ "$refreshed" -eq 0 ]; then
            echo "::error::No map was refreshed: all ${attempted} repos failed (${failed# }). The agents are reading stale maps."
            exit 1
          fi
          echo "Refreshed ${refreshed} of ${attempted} maps."
