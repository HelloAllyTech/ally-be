name: Builder session

# One coding run for a Builder session.
#
# Hosted here, in ally-be, as the ONLY copy. A multi-repo build belongs to no
# single target repo, and one copy cannot drift from five others. Target repos
# are cloned at run time rather than checked out by `actions/checkout`, which
# cannot loop over a variable list.
#
# This file is deliberately thin. Everything about *how* a build works — the
# protocol, the ordering, the reporting contract — is fetched from ally-be at
# run time, so changing it takes effect on the next dispatch instead of after
# a PR merges here.
#
# Required secrets on this repo:
#   ANTHROPIC_API_KEY  — the coding engine
#   ALLY_BE_API_KEY    — equals ally-be's API_KEY, for the pipeline callbacks
#   BUILDER_GH_TOKEN   — org PAT with contents:write + pull-requests:write on
#                        every target repo. NOT the default GITHUB_TOKEN: pull
#                        requests opened with that token do not trigger other
#                        workflows, so CI would never run on what Builder writes.
# Required variable:
#   ALLY_BE_API_URL    — base URL a runner can reach ally-be on.

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Builder session id
        required: true
      run_id:
        description: Builder run id (created before dispatch)
        required: true
      mode:
        description: build | resume
        required: true
        default: build
      repos:
        description: JSON array of repo names to clone
        required: true
      engine:
        description: Coding engine key (claude-code, …)
        required: false
        default: claude-code
      # One input for all three tiers rather than three: workflow_dispatch
      # accepts at most 10 inputs and this file is already at 9. ally-be
      # resolves the models and always sends all three.
      models:
        description: 'JSON {planner, coder, verifier} model ids'
        required: false
        default: '{}'
      branch_slug:
        description: Branch base — pushes go to builder/<slug>
        required: true
      branches:
        description: 'JSON map of {repo: branch} to resume from'
        required: false
        default: '{}'
      api_base_url:
        description: Base URL for ally-be callbacks
        required: false

# Serialised per session, so a resume can never overlap the run it continues.
# Different sessions run concurrently — that is the point of the grouping key.
concurrency:
  group: builder-session-${{ inputs.session_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALLY_BE_API_URL: ${{ inputs.api_base_url || vars.ALLY_BE_API_URL }}
      ALLY_BE_API_KEY: ${{ secrets.ALLY_BE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BUILDER_GH_TOKEN: ${{ secrets.BUILDER_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.BUILDER_GH_TOKEN }}
      # Tier 1 of `.claude/stacks-bridge.mjs`. Without it the bridge falls
      # through to `gh auth token`, and BUILDER_GH_TOKEN is a PAT with no
      # `read:org`, so the exchange 403s and every build phase runs with no
      # product guidance at all — which is what the first real build reported.
      STACKS_API_KEY: ${{ secrets.STACKS_API_KEY }}
      # The gate is the hook. ally-be's pre-commit runs eslint plus
      # `jest --findRelatedTests` on every commit the coder makes, and the
      # coder commits once per repo per remediation round; the gate then runs
      # the same checks once, on a clean tree, and is the thing `/complete`
      # actually trusts. Paying for both is paying twice for the weaker one.
      HUSKY: '0'
      BUILDER_SESSION_ID: ${{ inputs.session_id }}
      BUILDER_RUN_ID: ${{ inputs.run_id }}
      BUILDER_MODE: ${{ inputs.mode }}
      BUILDER_ENGINE: ${{ inputs.engine }}
      BUILDER_MODELS: ${{ inputs.models }}
      BUILDER_BRANCH_SLUG: ${{ inputs.branch_slug }}
      BUILDER_BRANCHES: ${{ inputs.branches }}
      BUILDER_REPOS: ${{ inputs.repos }}

    steps:
      - name: Check out the protocol (ally-be)
        uses: actions/checkout@v4
        with:
          path: protocol
          token: ${{ secrets.BUILDER_GH_TOKEN }}

      - name: Clone target repos
        run: |
          set -euo pipefail
          mkdir -p repos
          for repo in $(echo "$BUILDER_REPOS" | jq -r '.[]'); do
            echo "::group::clone $repo"
            # Blobless: full history so branching and `git diff master...HEAD`
            # work, but file contents fetched on demand. A full clone of
            # ally-web is minutes of runner time for blobs nothing reads.
            git clone --filter=blob:none \
              "https://x-access-token:${BUILDER_GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${repo}.git" \
              "repos/${repo}"
            echo "::endgroup::"
          done

      - name: Configure git identity
        run: |
          git config --global user.name "ally-builder[bot]"
          git config --global user.email "builder@helloally.ai"
          git config --global init.defaultBranch master

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Keyed on the repo list rather than a lockfile: the runner installs
      # dependencies for several repos, and there is no single lockfile that
      # represents the set. The list is joined with underscores rather than
      # interpolated raw — `repos` is a JSON array, and actions/cache rejects
      # any key containing a comma.
      - name: Cache package managers
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            ~/.cache/pypoetry
          key: builder-deps-${{ hashFiles('protocol/package-lock.json') }}-${{ join(fromJSON(inputs.repos), '_') }}
          restore-keys: builder-deps-

      - name: Install the coding engine
        run: protocol/scripts/builder/install-engine.sh

      - name: Fetch the build protocol
        run: |
          set -euo pipefail
          curl -fsS \
            "${ALLY_BE_API_URL}/api/v1/builder/pipeline/runs/${BUILDER_RUN_ID}/prompt" \
            -H "x-api-key: ${ALLY_BE_API_KEY}" \
            -o /tmp/build-prompt.txt
          wc -c /tmp/build-prompt.txt

      # PLAN → (CODE → GATE → VERIFY)* → FINALISE. The pull requests are
      # opened by the last phase, which is only reached once the machine test
      # gate and the independent reviewer are both satisfied.
      - name: Run the build
        run: protocol/scripts/builder/run-engine.sh /tmp/build-prompt.txt

      # `if: always()` so a run that failed still reports what it spent — an
      # agent that burned twenty dollars and crashed still spent it, and the
      # session budget has to know.
      - name: Report cost
        if: always()
        run: protocol/scripts/builder/report-cost.sh

      # `claude -p` exits 0 whenever the agent produces a final response —
      # including when it ends its turn mid-protocol. That makes "stopped after
      # CODE without committing" and "finished and opened PRs" the same green
      # job, which is exactly how a $16 run reported success having shipped
      # nothing. Both sibling agent workflows already gate on the outcome; this
      # is Builder's.
      #
      # A deliberate pause is also exit 0, and is healthy — the marker file is
      # how the engine itself tells the two apart, so we read it here too.
      - name: Fail if the run ended without reporting an outcome
        if: always()
        run: |
          set -uo pipefail

          if [ -f /tmp/builder-paused ]; then
            echo "Run parked on a question. That is a deliberate pause, not an abandonment."
            exit 0
          fi

          STATE=$(curl -sS -H "x-api-key: ${ALLY_BE_API_KEY}" \
            "${ALLY_BE_API_URL}/api/v1/builder/pipeline/runs/${BUILDER_RUN_ID}/status" || echo '')
          STATUS=$(printf '%s' "$STATE" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)
          PRS=$(printf '%s' "$STATE" | jq -r '.pullRequestCount // 0' 2>/dev/null || echo 0)
          echo "Run ${BUILDER_RUN_ID} is '${STATUS}' with ${PRS} pull request(s) after the engine exited."

          # `unknown` means ally-be was unreachable, not that the agent failed.
          # Never fail a run over a reporting hiccup — reconcile still backs us.
          if [ "$STATUS" = "unknown" ]; then
            echo "Could not read the run back; leaving it to reconcile."
            exit 0
          fi

          # Anything terminal is a run that reported for itself, whatever it said.
          if [ "$STATUS" != "QUEUED" ] && [ "$STATUS" != "RUNNING" ]; then
            exit 0
          fi

          echo "::error::The build ended while the run was still '${STATUS}' — it stopped mid-protocol without reporting an outcome."
          REASON="The build ended while the run was still '${STATUS}'. The agent stopped mid-protocol without completing, so anything it had not pushed is gone with the runner. Retry the build."
          curl -sS -X POST \
            "${ALLY_BE_API_URL}/api/v1/builder/pipeline/runs/${BUILDER_RUN_ID}/complete" \
            -H "x-api-key: ${ALLY_BE_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"outcome\":\"failed\",\"error\":\"${REASON}\"}" || true

          # The generic reporter below would otherwise post a second, vaguer
          # error on top of this one.
          touch /tmp/builder-already-reported
          exit 1

      # The runner-level net. Covers what the agent itself cannot report:
      # the runner dying, a bad clone, a wrong API key. ally-be ignores this
      # for a run already parked on a question, so a deliberate pause (which
      # exits 0 anyway) is never recorded as a failure.
      - name: Report failure
        if: failure()
        run: |
          if [ -f /tmp/builder-already-reported ]; then
            echo "The outcome gate already reported precisely why this run failed."
            exit 0
          fi
          curl -sS -X POST \
            "${ALLY_BE_API_URL}/api/v1/builder/pipeline/runs/${BUILDER_RUN_ID}/complete" \
            -H "x-api-key: ${ALLY_BE_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"outcome":"failed","error":"The build runner failed. See the workflow log."}' \
            || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-evidence-${{ inputs.run_id }}
          path: |
            /tmp/builder-evidence/**
            /tmp/builder-results/*.json
            /tmp/builder-plan.md
            /tmp/builder-gate/*.json
            /tmp/builder-gate-*.log
            /tmp/builder-baseline/*.json
          if-no-files-found: ignore
          retention-days: 14
