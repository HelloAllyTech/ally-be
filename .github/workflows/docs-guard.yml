name: Docs guard

# Keeps documentation in step with code. The rules live in .docs-map.yml at the repo root;
# the checker is shared across every Ally repo.
#
# Runs on pull requests, and on pushes to master — most changes here never open a PR, and a
# guard that only watches PRs would miss them. It cannot block a push that has landed, so
# there it reports rather than gates; the pre-push hook is the half that can still stop
# you (install: hooks/install.sh in helloallytech/.github).
#
# Spec: https://tech.helloally.ai/#/wiki/contributing/docs-system.md

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [master]

jobs:
  docs-guard:
    uses: helloallytech/.github/.github/workflows/docs-guard.yml@main
