# Tests — the PR gate.
#
# Until this existed, NO Ally repo ran its tests on a pull request. ally-be's
# suite ran only as a step inside `main.yaml`, which is `workflow_dispatch`-only
# (its `push: [master]` trigger is commented out), so the 344 spec files here
# were exercised on a manual deploy and nowhere else. Bug Hunter's nightly sweep
# had quietly become the de-facto CI, and Bug Hunter's own fix PRs merged with no
# check at all — which is why `bug-fix-session.yml` uses a dedicated
# BUG_HUNTER_GH_TOKEN rather than the default GITHUB_TOKEN: specifically so that
# CI would run on the fix. There was no CI to trigger.
#
# Deliberately separate from `main.yaml` rather than adding `pull_request` to it:
# that workflow is a deploy pipeline (prepare-env → test → build → deploy), and
# pointing it at pull requests would ship every PR.
#
# NOTE ON ENFORCEMENT: adding this file makes the checks run and report, but does
# not make them mandatory — that is a branch-protection setting. Landed that way
# on purpose, so a suite that turns out to be red on master blocks nobody while
# it is being fixed. Mark "test" and "lint" as required checks once they are
# green.

name: Tests

on:
  pull_request:
    branches: [master]
  # Also on master, so the branch's own health is visible rather than inferred
  # from whichever PR last ran.
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push supersedes the run in flight for the same ref — nobody needs the
  # result for a commit that has already been replaced.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Same flags main.yaml uses. --detectOpenHandles matters here: this suite
      # leaks handles (a worker has to be force-exited locally too), and without
      # --forceExit the job would hang until the timeout rather than reporting.
      - name: Run tests
        run: npm run test -- --forceExit --detectOpenHandles

  # The Builder runner's own harnesses. They fake the engine and ally-be, so they
  # need no credentials and no network — and until now nothing ran them: `npm
  # test` is jest with `rootDir: src`, which cannot see scripts/. That gap is not
  # theoretical. Two of the first three real Builder dispatches died on workflow
  # plumbing (unparseable YAML, then a comma in a cache key), each burning a
  # dispatch to learn something a local check would have caught in a second.
  builder-runner:
    name: Builder runner harnesses
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Catches the two failure classes above, plus the shell ones the YAML
      # parser cannot see.
      - name: Lint the workflows
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Shell lint the runner scripts
        run: shellcheck -S warning scripts/builder/*.sh scripts/builder/test/*.sh

      - name: Gate policy
        run: node scripts/builder/test/gate-verdict.test.mjs

      - name: Outcome gate
        run: bash scripts/builder/test/outcome-gate.test.sh

      - name: Engine loop dry run
        run: bash scripts/builder/test/loop-dryrun.sh

  lint:
    name: Lint & format
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Blocking. This was report-only for exactly one PR: lint had never run in
      # CI in any Ally repo, so its first run surfaced 9 pre-existing prettier
      # violations rather than anything the introducing change had done. Those are
      # now fixed, so the check earns the right to fail the build.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

  # Workflow files themselves are code, and until 2026-08-28 nothing checked
  # them. Two Builder workflows carried an unquoted `": "` inside an input
  # description, which is a YAML syntax error. GitHub registers an unparseable
  # workflow anyway — with no triggers — so the failure surfaced as a lying
  # error message ("Workflow does not have 'workflow_dispatch' trigger") on
  # every Builder dispatch, and the weekly context refresh silently never ran.
  # actionlint parses each file and would have failed the PR that introduced it.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Pinned release binary, same approach as secret-scan.yml uses for
      # gitleaks: no marketplace action in the supply chain for a linter.
      - name: Install actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -version

      # Blocking, and green on every workflow in this repo as of landing.
      #
      # -shellcheck= turns off the bundled shellcheck integration. Left on, it
      # reports 112 SC2086/SC2129 style notes inside main.yaml and
      # production-release.yaml — quoting nits in two deploy pipelines that
      # work — which would mean rewriting them before this check could ever be
      # blocking. Structural linting is what catches the class of bug above.
      - name: Lint workflows
        run: actionlint -shellcheck=
