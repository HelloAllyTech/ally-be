version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=lifeline_chat
      - JWT_SECRET=your-secret-key
      - JWT_REFRESH_SECRET=your-refresh-secret-key
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - app-network

  postgres:
    image: postgres:14-alpine
    ports:
      - "5477:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lifeline_chat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=sqs
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=1
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqs-setup:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - app-network
    entrypoint: >
      sh -c "
        echo '🚀 Waiting for LocalStack...' &&
        sleep 5 &&
        echo '📦 Creating SQS queues...' &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-request-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-response-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-file-retry-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-upload-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-request-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-response-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-file-retry-queue-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-upload-queue-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-learn-message-and-event-queue &&

        echo '🔗 Setting up Dead Letter Queues...' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-request-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-request-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-response-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-response-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-file-retry-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-file-retry-queue-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-upload-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-upload-queue-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        echo '🎉 All SQS queues and DLQs are ready!'
      "
networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: