services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Come back automatically after a Docker/Colima restart (matches the other
    # services and ally-web). Without this the API stays down while infra returns.
    restart: unless-stopped
    ports:
      # Map container port to host based on app PORT (.env). Default PORT=8001.
      - '8001:8001'
    env_file:
      - .env
    environment:
      # First-time dev: set AUTO_SEED=true in .env to run npm run seed after migrations, then set false.
      AUTO_SEED: '${AUTO_SEED:-false}'
      # Docker networking note:
      # Containers talk to each other via Docker DNS using service names, not localhost.
      # These values deliberately override any .env values to ensure the app connects
      # to the Compose services when running in Docker.
      # - Inside Docker: use 'redis' and 'postgres' (service names)
      # - Outside Docker (local dev): you might use 'localhost' — keep that in .env only
      # Change only if you rename the services or run Redis/Postgres elsewhere.
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      DB_HOST: 'postgres'
      DB_PORT: '5432'
      # When running inside docker-compose, point AWS/SQS endpoints to localstack service
      AWS_ENDPOINT_URL: 'http://localstack:4566'
      # Presigned URLs are returned to the browser, which can't resolve "localstack".
      # Override only the S3 presign endpoint to a host-reachable URL.
      AWS_S3_PRESIGN_ENDPOINT_URL: 'http://localhost:4566'
      # Presigned URLs forwarded to other containers (e.g. ally-ai via SQS) need
      # a hostname those containers can resolve. host.docker.internal works from
      # any container on Docker Desktop and is also reachable from this one.
      AWS_S3_INTERNAL_PRESIGN_ENDPOINT_URL: 'http://host.docker.internal:4566'
      # These SQS URLs use "http://localstack:4566" instead of the DNS-style regional
      # hostnames (e.g., sqs.us-east-1.localhost.localstack.cloud) because:
      #
      # 1. Inside Docker, the app container must reach LocalStack using Docker's internal DNS.
      #    The hostname "localstack" correctly resolves to the LocalStack container, while the
      #    public DNS-style hostnames only work on the host machine and do NOT resolve inside containers.
      #
      # 2. We do NOT include a region in the URL because LocalStack exposes all AWS services on a
      #    single edge endpoint (http://localstack:4566). The AWS SDK determines the region from
      #    the AWS_REGION environment variable, not from the URL.
      #
      # 3. Our environment uses "us-east-1" as the default region, which matches LocalStack’s
      #    own default. Because the region is already provided via AWS_REGION, it does not need
      #    to be encoded in the SQS endpoint URL.
      #
      # This setup keeps the configuration simple, reliable inside Docker, and consistent with
      # how the AWS SDK resolves regions.
      SQS_TRANSCRIPTION_REQUEST_QUEUE_URL: 'http://localstack:4566/000000000000/sqs-ai-transcription-request-queue'
      SQS_TRANSCRIPTION_REQUEST_DLQ_URL: 'http://localstack:4566/000000000000/sqs-ai-transcription-request-dlq'
      SQS_AUDIO_FILE_RETRY_QUEUE_URL: 'http://localstack:4566/000000000000/sqs-audio-file-retry-queue'
      SQS_AUDIO_FILE_RETRY_DLQ_URL: 'http://localstack:4566/000000000000/sqs-audio-file-retry-queue-dlq'
      SQS_LEARN_MESSAGE_AND_EVENT_QUEUE_URL: 'http://localstack:4566/000000000000/sqs-learn-message-and-event-queue'
      # Dynamic i18n: backend writes drafts/published versions here.
      # Mount this folder behind your reverse proxy/CDN to serve translations.
      I18N_ROOT_DIR: '/var/www/i18n'
      I18N_VERSION_RETENTION: '5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      sqs-setup:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      # 1) Mount source for live reload
      - .:/app
      # 2) Keep container's node_modules (Linux) instead of host's
      - /app/node_modules
      # 3) Persistent i18n storage shared with Caddy on the host
      - /var/www/i18n:/var/www/i18n
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    ports:
      - '5477:5432'
    env_file:
      - docker.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ally_local']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - app-network

  # Pin image: :latest (2026.3.0+) requires LOCALSTACK_AUTH_TOKEN; the temporary
  # LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT bypass ended 2026-04-06. This tag
  # matches the classic community image (SQS-only here) without login.
  localstack:
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    container_name: localstack
    ports:
      - '4566:4566'
    env_file:
      - docker.env
    environment:
      - SERVICES=sqs,s3
      - DEBUG=1
      - LOCALSTACK_HOSTNAME=localstack
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 5

  sqs-setup:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    env_file:
      - docker.env
    networks:
      - app-network
    entrypoint: >
      sh -c "
        echo '🚀 Waiting for LocalStack...' &&
        sleep 5 &&
        echo '🪣 Creating S3 buckets...' &&
        aws --endpoint-url=http://localstack:4566 s3 mb s3://audio-storage-s3-bucket || true &&
        aws --endpoint-url=http://localstack:4566 s3 mb s3://learn-media-public-s3-bucket || true &&
        aws --endpoint-url=http://localstack:4566 s3 mb s3://s3_bucket || true &&
        aws --endpoint-url=http://localstack:4566 s3 mb s3://local-dev-scenario-session-audio || true &&
        echo '🔓 Configuring bucket CORS for browser uploads...' &&
        for B in audio-storage-s3-bucket learn-media-public-s3-bucket local-dev-scenario-session-audio; do aws --endpoint-url=http://localstack:4566 s3api put-bucket-cors --bucket $$B --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"POST\",\"HEAD\",\"DELETE\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]}' || true; done &&
        echo '📦 Creating SQS queues...' &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-request-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-response-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-file-retry-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-upload-queue &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-request-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-ai-transcription-response-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-file-retry-queue-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-audio-upload-queue-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name sqs-learn-message-and-event-queue &&

        echo '🔗 Setting up Dead Letter Queues...' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-request-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-request-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-response-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-ai-transcription-response-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-file-retry-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-file-retry-queue-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        MAIN_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-upload-queue --query 'QueueUrl' --output text) &&
        DLQ_URL=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-url --queue-name sqs-audio-upload-queue-dlq --query 'QueueUrl' --output text) &&
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes --queue-url $$DLQ_URL --attribute-names QueueArn --query 'Attributes.QueueArn' --output text) &&
        aws --endpoint-url=http://localstack:4566 sqs set-queue-attributes --queue-url $$MAIN_URL --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"'$$DLQ_ARN'\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}' &&
        echo '🎉 All SQS queues and DLQs are ready!'
      "
networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
